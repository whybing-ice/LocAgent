[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "locagent"
version = "0.1.0"
description = "2D BLE localization with adaptive observation windows and report screening"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy", "scipy"]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
